<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="50%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#bf5af2" />
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#softGlow)" />
  
  <!-- Glass Droplet Shape -->
  <path d="M 256,96 C 256,96 144,232 144,320 C 144,381.85 194.15,432 256,432 C 317.85,432 368,381.85 368,320 C 368,232 256,96 256,96 Z"
        fill="rgba(255, 255, 255, 0.22)" 
        stroke="url(#glassRim)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Specular Lens Glint -->
  <ellipse cx="220" cy="270" rx="36" ry="64" transform="rotate(-30 220 270)" fill="rgba(255, 255, 255, 0.65)" />
</svg>
